<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommandations — Japon 🇯🇵</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇯🇵</text></svg>">
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charter:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="landing-body">

  <main class="landing-container">
    <header class="landing-header">
      <span class="site-meta">Guide de voyage</span>
      <h1>Mes recommandations au Japon</h1>
      <p class="subtitle">Choisis une ville pour explorer les adresses.</p>
    </header>

    <div class="city-selector">
      <a href="tokyo.html" class="city-card">
        <div class="city-image-wrapper">
          <img src="tokyo-hero.jpg" alt="Tokyo" class="city-image" />
        </div>
        <div class="city-info">
          <h2>Tokyo 🗼</h2>
          <p>Shibuya, Ginza, Asakusa, Roppongi...</p>
        </div>
      </a>

      <a href="kyoto.html" class="city-card">
        <div class="city-image-wrapper">
          <img src="kyoto-hero.jpg" alt="Kyoto" class="city-image" />
        </div>
        <div class="city-info">
          <h2>Kyoto ⛩️</h2>
          <p>Temples, histoire et culture...</p>
        </div>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Bon voyage ! 🇯🇵</p>
    </div>
  </footer>

</body>
</html>
